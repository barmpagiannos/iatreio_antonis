<!doctype html>
<html lang="el">
  <head>

        <p class="header-label">Ιατρείο</p>
        <h1>Μπαρμπαγιάννος Αντώνης</h1>

      <section class="welcome" aria-labelledby="welcome-title">

        <a class="appointment-button" href="#appointment-widget">
          Κλείστε ραντεβού <span>↘</span>
        </a>

        <div class="appointment-widget" id="appointment-widget">
          <iframe 
            src="https://medical-appointment-booking-widget.ai.studio/?embed=true&doctor=Y92OxqVkiFhUZgZcBHNK" 
            width="100%" 
            height="720" 
            frameborder="0" 
            scrolling="no"
            style="border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);"
            title="Κράτηση Ραντεβού">
          </iframe>
        </div>
      </section>
    </main>
